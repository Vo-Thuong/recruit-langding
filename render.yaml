# render.yaml – Render Blueprint
# Deploy: https://render.com/docs/blueprint-spec
# Setup: connect this repo in Render Dashboard → "New Blueprint Instance"

services:
  # ── Backend: Go REST API ─────────────────────────────────────
  - type: web
    name: recruit-be
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruit-db
          property: connectionString
      - key: PORT
        value: "8080"
    healthCheckPath: /health

  # ── Frontend: React Static Site ──────────────────────────────
  - type: web
    name: recruit-fe
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    plan: free
    region: singapore
    envVars:
      # Replace with your actual backend URL after deploying recruit-be
      - key: REACT_APP_API_URL
        value: https://recruit-be.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ───────────────────────────────────────
databases:
  - name: recruit-db
    databaseName: recruitdb
    user: recruit_user
    plan: free
    region: singapore
