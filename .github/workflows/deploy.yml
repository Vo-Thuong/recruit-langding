name: Full Build & Deploy Pipeline

on:
  push:
    branches: [main, vothuong, recruit-landing-brand]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - "render.yaml"

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Kéo code từ repo GitHub vào máy ảo

      - name: Set up Go
        uses: actions/setup-go@v5  # Cài đặt môi trường Go
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run vet
        working-directory: backend
        run: go vet ./...  # KIỂM TRA MÃ NGUỒN (CI)

      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux go build -o server .

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Set up Node.js
        uses: actions/setup-node@v4  # Cài đặt môi trường Node.js
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci   # Cài đặt sạch sẽ các thư viện trong package.json

      - name: Build
        working-directory: frontend
        run: npm run build  # KIỂM TRA BUILD TĨNH (CI)
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false

  deploy:
    name: Deploy to Render
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger Backend Web Service Deploy
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"

      - name: Trigger Frontend Static Site Deploy
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          echo "Checking backend health..."
          curl -f https://recruit-langding.onrender.com/health || echo "Backend web service is initializing..."
          echo "Deployment signals sent successfully - track real-time build logs on your Render Dashboard."
